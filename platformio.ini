
[env:esp32dev-mini]
board = esp32-c3-devkitm-1
lib_compat_mode = strict
platform = espressif32
framework = arduino
monitor_speed = 115200
; Lower, more robust upload rate — the native-USB C3 was dropping the large app image
; mid-write at the default speed (flaky USB power/cable on the car rig).
upload_speed = 115200
lib_deps =
	https://github.com/collin80/esp32_can.git
	collin80/can_common@^0.4.0
	NimBLE-Arduino@^2.0.0
	hoeken/PsychicHttp@^1.2.1
	https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
	ppedro74/SerialCommands@^2.2.0
	powerbroker2/ELMDuino@^3.4.1
monitor_filters = send_on_enter, log2file
build_flags =
	; No code here throws (the one throw was an unimplemented stub nobody caught —
	; on the target an uncaught throw is an abort + reboot, not a diagnostic).
	; Dropping the unwind tables from everything built from source — our src, the
	; Arduino core, NimBLE, PsychicHttp — saves ~72KB of flash. The prebuilt IDF
	; blobs (net80211, lwip, btdm) keep their own, which is the rest of the ~110KB.
	-fno-exceptions
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ELEGANTOTA_USE_PSYCHIC=1
	-D USE_NIMBLE
	; Two BLE links: the iPhone (AMS/ANCS/CTS — we take a GATT client over that
	; inbound connection) and optionally an Android head unit subscribed to our HID
	; service. Library default is 3; 2 is what we need and costs ~2.5-4KB less host
	; state. Raising this also raises NimBLE's mempool sizing at init().
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
	; Two bonds to keep (iPhone + head unit). Default 3 leaves no slack.
	-D CONFIG_BT_NIMBLE_MAX_BONDS=4
; MM firmware = everything except the VH board's sources (src/vh compiles only
; in [env:vehicle-wrover]; the portable src/vh core also builds in native tests).
build_src_filter = +<*> -<vh/> -<gw/> -<disp/>
board_build.partitions = partitions_ota.csv
extra_scripts =
	pre:gen-pages.py
	merge-bin.py



