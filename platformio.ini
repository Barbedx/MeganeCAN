; DISP board (ARCHITECTURE-V2 §6, M2): the C3 SuperMini as the thin IO
; Controller — multimedia CAN + AFFA3 drivers + SWC capture + USB console
; (bench proxy + the @PROG USB<->link programming bridge). No BLE/WiFi/web:
; media and commands arrive over the link from GW; keys go back the same way.
[env:disp-c3]
board = esp32-c3-devkitm-1
lib_compat_mode = strict
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
	https://github.com/collin80/esp32_can.git
	collin80/can_common@^0.4.0
	ppedro74/SerialCommands@^2.2.0
	powerbroker2/ELMDuino@^3.4.1
monitor_filters = send_on_enter, log2file
build_flags =
	-fno-exceptions ; see esp32dev-mini
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<disp/> +<display/> +<affa/> +<bus/> +<utils/> +<effects/> +<wire/SerialWireLink.cpp> +<link/> -<link/mm/> +<media/MediaRouter.cpp> +<media/HuLinkMediaSource.cpp> +<keys/KeyRouter.cpp> +<vh/target/LinkTunnel.cpp> +<vh/target/VhConfig.cpp> +<vh/target/FsLogger.cpp> +<ElmManager/>
board_build.partitions = partitions_ota.csv


; GW board (ARCHITECTURE-V2 §5, M1): the WROVER as the only application
; processor — vehicle CAN + Raise canbox + BLE (AMS/HID) + WiFi/web/OTA +
; media/key routing. The OEM display is remote (RemoteDisplay -> DISP_CMD/
; MEDIA_TEXT over the link); the C3 keeps rendering. Excludes the C3 main,
; the serial console (C3 bench surface) and the C3-side link service.
[env:gw-wrover]
board = esp32dev
lib_compat_mode = strict
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
	https://github.com/collin80/esp32_can.git
	collin80/can_common@^0.4.0
	NimBLE-Arduino@^2.0.0
	hoeken/PsychicHttp@^1.2.1
	https://github.com/ayushsharma82/ElegantOTA.git#psychic-http
	ppedro74/SerialCommands@^2.2.0
	powerbroker2/ELMDuino@^3.4.1
build_flags =
	-fno-exceptions ; see esp32dev-mini (~72KB of flash)
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-D ELEGANTOTA_USE_PSYCHIC=1
	-D USE_NIMBLE
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
	-D CONFIG_BT_NIMBLE_MAX_BONDS=4
; Exclude the C3-only surfaces: its main + serial console, the C3-side link
; service, the AFFA3 display drivers and the whole bench-RE stack (virtual
; displays, emulation twin, ISO-TP capture/replay) — the GW's display is remote.
build_src_filter = +<*> -<main.cpp> -<console/> -<disp/> -<link/mm/> -<keys/UartCanboxSink.cpp> -<vh/target/vh_main.cpp> -<display/> +<display/Carminat/Menu/> -<vdisplay/> -<emulation/> -<record/> -<affa/>
board_build.partitions = partitions_gw.csv
extra_scripts =
	pre:gen-pages.py


; Native host env for fast, hardware-free regression tests (pio test -e native).
; Compiles ONLY the portable logic layer (bus/affa/vdisplay) against Unity — the
; firmware src is excluded via build_src_filter (it pulls Arduino/CAN_FRAME). The
; NATIVE define guards the few target-only spots. See test/ for the suites.
[env:native]
platform = native
test_framework = unity
; Compile the project src/ into the test binary (off by default in test mode) so the
; tests link against the real logic layer, narrowed by build_src_filter below.
test_build_src = yes
build_flags =
	-std=gnu++17
	-D NATIVE
	-I src
; Compile only the portable logic layer (no Arduino/CAN_FRAME). Header-only mocks
; (bus/LoopbackCanBus.h, test/FakeClock.h) need no entry here.
build_src_filter = -<*> +<affa/> +<vdisplay/> +<record/> +<emulation/> +<core/> +<display/AffaDisplayBase.cpp> +<media/MediaRouter.cpp> +<media/HuLinkMediaSource.cpp> +<keys/KeyRouter.cpp> +<link/> -<link/mm/> -<link/ProgOtaClient.cpp> +<vh/> -<vh/target/> +<gw/RemoteDisplay.cpp> +<disp/DispCmdServer.cpp>
